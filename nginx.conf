events {
    worker_connections 1024;
}

http {

    log_format backend_log '$remote_addr - [$time_local] "$request" '
                          'backend=$upstream_addr';

    # Write upstream (only app1 - master database)
    upstream fastapi_backend {
        server  host.docker.internal:8001;
        server  host.docker.internal:8002;
        server  host.docker.internal:8003;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 100M;

        access_log /var/log/nginx/access.log backend_log;

        location / {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check endpoint - use write upstream to ensure master is healthy
        location /health {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            access_log off;
        }

        # API documentation should go to write instance
        location /docs {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
        }

    }
}